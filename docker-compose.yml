services:
  latex:
    build:
      context: .
      dockerfile: .docker/Dockerfile
    image: kalamos-latex
    container_name: kalamos-latex
    restart: unless-stopped
    volumes:
      - ./projects:/projects

  kalamos:
    build:
      context: .
      dockerfile: .docker/Dockerfile.app
    container_name: kalamos
    restart: unless-stopped
    depends_on:
      - latex
    environment:
      - KALAMOS_LATEX_CONTAINER=kalamos-latex
      - KALAMOS_PORT=4001
    ports:
      - "4001:4001"
    volumes:
      - ./projects:/app/projects
      - /var/run/docker.sock:/var/run/docker.sock
